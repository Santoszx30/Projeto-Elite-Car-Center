<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil de Preferências - Elite Car Center</title>

    <link rel="stylesheet" href="Questionario.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="Logo elite car center.png" alt="Logo Elite Car Center">
        </div>

        <div class="titulo">
            <h1>CENTRO AUTOMOTIVO DE ELITE</h1>
        </div>

        <a href="TelaLogin.html" class="botao-voltar">
            <i class="fa-solid fa-right-from-bracket"></i>
            Voltar para o Site
        </a>

    </header>

    <main>

        <section class="questionario">

            <div class="pergunta">
                <h2>
                    <span class="numero">1.</span>
                    Qual estilo de Veículo mais combina com você?
                </h2>

                <div class="opcoes">
                    <label class="opcao">
                        <input type="checkbox" name="estilo" value="suv">
                        <span class="marcador"></span>
                        SUV
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="estilo" value="sedan">
                        <span class="marcador"></span>
                        SEDAN
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="estilo" value="pickup">
                        <span class="marcador"></span>
                        PICKUP
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="estilo" value="esportivo">
                        <span class="marcador"></span>
                        ESPORTIVO
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="estilo" value="luxo">
                        <span class="marcador"></span>
                        LUXO
                    </label>
                </div>
            </div>

            <div class="pergunta">
                <h2>
                    <span class="numero">2.</span>
                    O que você mais valoriza em um carro?
                </h2>

                <div class="opcoes">
                    <label class="opcao">
                        <input type="checkbox" name="valoriza" value="conforto">
                        <span class="marcador"></span>
                        CONFORTO
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="valoriza" value="performance">
                        <span class="marcador"></span>
                        PERFORMANCE
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="valoriza" value="tecnologia">
                        <span class="marcador"></span>
                        TECNOLOGIA
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="valoriza" value="design">
                        <span class="marcador"></span>
                        DESIGN
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="valoriza" value="economia">
                        <span class="marcador"></span>
                        ECONOMIA
                    </label>
                </div>
            </div>

            <div class="pergunta">
                <h2>
                    <span class="numero">3.</span>
                    Qual será o principal uso do veículo?
                </h2>

                <div class="opcoes">
                    <label class="opcao">
                        <input type="checkbox" name="uso" value="uso-diario">
                        <span class="marcador"></span>
                        USO DIARIO
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="uso" value="viagens">
                        <span class="marcador"></span>
                        VIAGENS
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="uso" value="trabalho">
                        <span class="marcador"></span>
                        TRABALHO
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="uso" value="lazer">
                        <span class="marcador"></span>
                        LAZER
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="uso" value="colecionar">
                        <span class="marcador"></span>
                        COLECIONAR
                    </label>
                </div>
            </div>

            <div class="pergunta">
                <h2>
                    <span class="numero">4.</span>
                    Qual faixa de investimento você procura?
                </h2>

                <div class="opcoes">
                    <label class="opcao">
                        <input type="checkbox" name="investimento" value="ate-200mil">
                        <span class="marcador"></span>
                        ATÉ R$ 200 MIL
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="investimento" value="ate-500mil">
                        <span class="marcador"></span>
                        ATÉ R$ 500 MIL
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="investimento" value="ate-1mi">
                        <span class="marcador"></span>
                        ATÉ R$ 1 MI
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="investimento" value="acima-1mi">
                        <span class="marcador"></span>
                        ACIMA DE 1 MI
                    </label>
                </div>
            </div>

            <div class="pergunta">
                <h2>
                    <span class="numero">5.</span>
                    Quais marcas te interessam?
                </h2>

                <div class="opcoes">
                    <label class="opcao">
                        <input type="checkbox" name="marcas" value="bmw">
                        <span class="marcador"></span>
                        BMW
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="marcas" value="mercedes">
                        <span class="marcador"></span>
                        MERCEDES
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="marcas" value="porshe">
                        <span class="marcador"></span>
                        PORSHE
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="marcas" value="audi">
                        <span class="marcador"></span>
                        AUDI
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="marcas" value="ferrari">
                        <span class="marcador"></span>
                        FERRARI
                    </label>

                    <label class="opcao">
                        <input type="checkbox" name="marcas" value="outros">
                        <span class="marcador"></span>
                        OUTROS
                    </label>
                </div>
            </div>

            <p class="aviso">
                <i class="fa-solid fa-thumbs-up"></i>
                Seleção de multiplas respostas liberada!
            </p>

            <button class="botao-enviar" type="button">
                ENVIAR
            </button>

        </section>

    </main>

    <script src="Questionario.js" defer></script>

</body>

</html>
